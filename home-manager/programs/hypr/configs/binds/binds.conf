source = ~/Config/home-manager/programs/hypr/configs/binds/workspaces.conf
source = ~/Config/home-manager/programs/hypr/configs/binds/execs.conf
source = ~/Config/home-manager/programs/hypr/configs/binds/volume.conf

## UTILS

# Move/resize windows with mainMod + LMB/RMB and dragging

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod SHIFT, A, movetoworkspace, special:magic

# OTHER

# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle
