[colors.primary]
foreground = "#bfbdb6"
background = "#0b0e14"

[colors.cursor]
text = "#0b0e14"
cursor = "#bfbdb6"

[colors.selection]
text = "#bfbdb6"
background = "#1b3a5b"

[colors.normal]
black = "#1e232b"
red = "#ea6c73"
green = "#7fd962"
yellow = "#f9af4f"
blue = "#53bdfa"
magenta = "#cda1fa"
cyan = "#90e1c6"
white = "#c7c7c7"

[colors.bright]
black = "#686868"
red = "#f07178"
green = "#aad94c"
yellow = "#ffb454"
blue = "#59c2ff"
magenta = "#d2a6ff"
cyan = "#95e6cb"
white = "#ffffff"

[font]

size = 15

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"


[window]
padding = { x = 8, y = 8 }
blur = true
opacity = 0.9
decorations_theme_variant = "Dark"

[cursor.style]
shape = "Underline"
blinking = "Never"

[cursor]
unfocused_hollow = false

[keyboard]
bindings = [
{key = "C", mods = "Alt", chars = "clear\n"},
{key = "B", mods = "Alt", chars = "nrb\n"},
{key = "Back", mods = "Control", chars = "\u0017"}
]
